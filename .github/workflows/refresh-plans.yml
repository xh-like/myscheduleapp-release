name: 云端刷新排班计划数据

# 每 3 小时从腾讯文档重新拉取《运维作业计划申请》，生成 plans.json 并提交到本仓库。
# 运行在 GitHub 的机器上，不需要本机开机。
#
# 依赖的仓库 Secret（Settings → Secrets and variables → Actions）：
#   TDOC_ACCESS_TOKEN   腾讯文档开放平台 access_token（Client-Id / Open-Id 自动从其 JWT 解析）
# 未配置时本任务以「跳过」结束，不会报错、不会改动 plans.json。
# 注意：access_token 有效期 30 天，到期前需要换新（脚本会在剩余不足 7 天时给出告警）。

on:
  schedule:
    # UTC 01/04/07/10/13/16/19/22 点 = 北京时间 09/12/15/18/21/00/03/06 点
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
  # 手动触发通道：改一下 .refresh-now 的内容再 push 即可跑一次（无需令牌）
  push:
    paths:
      - '.refresh-now'

concurrency:
  group: refresh-plans
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # purge 被限流时脚本要按服务器给的 reset 等待，留足 45 分钟
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      TDOC_ACCESS_TOKEN: ${{ secrets.TDOC_ACCESS_TOKEN }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查凭据是否已配置
        id: cred
        run: |
          if [ -z "$TDOC_ACCESS_TOKEN" ]; then
            echo "::notice::未配置 Secret TDOC_ACCESS_TOKEN，本次跳过。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取腾讯文档子表
        if: steps.cred.outputs.ready == 'true'
        run: python3 tools/fetch_tencent_sheets.py --out-dir .plansrc

      - name: 生成 plans.json
        if: steps.cred.outputs.ready == 'true'
        run: python3 tools/gen_plans.py .plansrc plans.json

      - name: 有变化才提交并推送
        id: commit
        if: steps.cred.outputs.ready == 'true'
        run: |
          set -e
          rm -rf .plansrc
          if git diff --quiet -- plans.json; then
            echo "plans.json 内容无变化，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "plans-bot"
          git config user.email "plans-bot@users.noreply.github.com"
          git add plans.json
          COUNT=$(python3 -c "import json;print(json.load(open('plans.json'))['count'])")
          git commit -m "plans: 云端自动刷新 $(date '+%Y-%m-%d %H:%M')（${COUNT} 项）"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # App 主通道走 jsDelivr，分支引用默认缓存 12 小时；提交后必须主动 purge，
      # 否则手机端最长会落后半天。purge 失败不影响数据本身（GitHub 已是最新）。
      - name: 刷新并校验 jsDelivr CDN 缓存
        # 数据已经提交成功；CDN 刷新失败只是「手机端可能读到旧缓存」，
        # 不应让整轮运行变红。失败会在步骤面板以警告色标出。
        continue-on-error: true
        if: steps.commit.outputs.pushed == 'true'
        run: |
          # jsDelivr 的 purge 有配额，被限流时会返回 throttled + throttlingReset，
          # 此时单次 purge 会被静默忽略、缓存继续保留 12 小时。脚本会按 reset 等待重试，
          # 并以「CDN 字节 == 本地文件」为准判定成功。
          python3 tools/purge_cdn.py plans.json --max-wait 1800
