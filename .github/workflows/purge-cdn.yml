name: 发布新版本后刷新 CDN 缓存

# jsDelivr 对 @main 这类分支引用默认缓存约 12 小时；purge 有配额，被限流时
# 会被静默忽略。一旦推送了新的 version.json / app-release.apk 却没真正刷新，
# App 的「检查更新」会连续十几个小时读不到新版本。
#
# 本工作流在 version.json 或 app-release.apk 变化时触发，反复 purge 直到
# 以「CDN 字节 == 仓库文件」确认成功为止（限流时按服务器给的 reset 等待）。
#
# plans.json 的缓存由 refresh-plans.yml 负责，不在此重复处理。

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
      - 'app-release.apk'
  workflow_dispatch:

concurrency:
  group: purge-cdn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 刷新并校验 version.json 与安装包
        run: |
          python3 tools/purge_cdn.py version.json app-release.apk --max-wait 1500
