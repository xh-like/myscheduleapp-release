<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>腾讯文档授权回调</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f5f6f8; color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: min(560px, calc(100vw - 32px)); background: #fff; border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 26px 24px; box-sizing: border-box;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #6b7280; margin: 0 0 18px; line-height: 1.6; }
  .label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .val {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px;
    background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 12px 14px; word-break: break-all; line-height: 1.5; user-select: all;
  }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  button {
    flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #d1d5db;
    background: #fff; font-size: 14px; cursor: pointer;
  }
  button.primary { background: #07c160; border-color: #07c160; color: #fff; font-weight: 600; }
  button:active { transform: translateY(1px); }
  .hint { font-size: 12px; color: #9ca3af; margin-top: 16px; line-height: 1.7; }
  .err { border-color: #fca5a5; background: #fef2f2; color: #b91c1c; }
  .ok { display: none; font-size: 12px; color: #07c160; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <h1>腾讯文档授权回调</h1>
  <p class="sub">这一步只做一件事：把授权成功后腾讯文档回传的 <code>code</code> 显示出来。<br>页面不联网、不上报，也不会保存任何内容。</p>

  <div class="label">授权码</div>
  <div class="val" id="code">（未收到 code）</div>
  <div class="ok" id="ok">已复制</div>

  <div class="row">
    <button class="primary" id="copy">复制授权码</button>
    <button id="raw">复制完整地址</button>
  </div>

  <p class="hint">
    把授权码发回对话即可完成换取。它 5–10 分钟内有效，且只能用一次；<br>
    过期了不要紧，重新打开授权链接再扫一次就换新的。
  </p>
</div>

<script>
(function () {
  // 授权页把 code 拼回 redirect_uri 时，可能用 ? 或 & 连接，
  // 而本页地址本身已带 sharecode 参数，所以先按标准解析，再退回正则兜底。
  function pick(key) {
    try {
      var v = new URLSearchParams(location.search).get(key);
      if (v) return v;
    } catch (e) {}
    var m = location.href.match(new RegExp('[?&]' + key + '=([^&#]+)'));
    return m ? decodeURIComponent(m[1]) : '';
  }

  var code = pick('code');
  var err = pick('error') || pick('errcode');

  var box = document.getElementById('code');
  var okTip = document.getElementById('ok');

  if (code) {
    box.textContent = code;
  } else if (err) {
    box.textContent = '授权失败：' + err;
    box.className = 'val err';
  } else {
    box.textContent = '（未收到 code，请从授权链接进入本页）';
  }

  function flash() {
    okTip.style.display = 'block';
    setTimeout(function () { okTip.style.display = 'none'; }, 1600);
  }

  function copy(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); flash(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  document.getElementById('copy').addEventListener('click', function () {
    copy(code);
  });
  document.getElementById('raw').addEventListener('click', function () {
    copy(location.href);
  });
})();
</script>
</body>
</html>
